# Шаблон пользовательского словаря замен.
#
# Скопируйте этот файл в свой профиль под именем glossary.toml — точный путь
# показывает вкладка «Диагностика». Приложение читает пользовательский файл,
# а этот шаблон остаётся неизменным при обновлениях.
#
# Зачем нужен: распознавание речи записывает английские термины кириллицей
# («курсор», «питон», «гитхаб»). Замены выполняются детерминированно, до
# обращения к языковой модели, поэтому термины не искажаются.
#
# Правила:
#   * сопоставление идёт по целому слову, регистр не важен;
#   * длинные записи применяются раньше коротких;
#   * замена подставляется буквально, как написана справа.

[replacements]
"курсор" = "Cursor"
"питон" = "Python"
"пайтон" = "Python"
"гитхаб" = "GitHub"
"гит хаб" = "GitHub"
"докер" = "Docker"
"реакт" = "React"
"тайпскрипт" = "TypeScript"
"джаваскрипт" = "JavaScript"
"апи" = "API"
"эндпоинт" = "endpoint"
"коммит" = "commit"
"пул реквест" = "pull request"
"мердж" = "merge"
"деплой" = "deploy"
"баг" = "баг"
"линтер" = "linter"
"воркфлоу" = "workflow"
