# Эталонные примеры очистки речи.
#
# Слева — то, что выдаёт распознавание живой диктовки, справа — что должно
# получиться после детерминированной очистки, без языковой модели.
#
# Правило пополнения: сначала добавьте случай, который сейчас работает плохо,
# затем правьте код. Так регрессии видны сразу.

[[case]]
name = "слова-паразиты в начале и середине"
raw = "ну короче надо как бы переделать эту функцию"
expected = "Надо переделать эту функцию"

[[case]]
name = "мычание"
raw = "надо э-э подумать над ммм архитектурой"
expected = "Надо подумать над архитектурой"

[[case]]
name = "повтор слова"
raw = "я я я думаю что это правильно"
expected = "Я думаю что это правильно"

[[case]]
name = "повтор словосочетания"
raw = "то есть то есть нужно добавить проверку"
expected = "То есть нужно добавить проверку"

[[case]]
name = "ложное начало"
raw = "надо прогр программу запустить"
expected = "Надо программу запустить"

[[case]]
name = "мусорная пунктуация после удаления"
raw = "значит, ну, короче, делаем так"
expected = "Значит, делаем так"

[[case]]
name = "чистая речь не меняется"
raw = "Добавь проверку входных данных и напиши тест."
expected = "Добавь проверку входных данных и напиши тест."

[[case]]
name = "несколько предложений"
raw = "ну сначала читаем файл. потом как бы парсим его. и типа сохраняем"
expected = "Сначала читаем файл. Потом парсим его. И сохраняем"

[[case]]
name = "значимые слова остаются"
raw = "это просто вот значит то есть важно"
expected = "Это просто вот значит то есть важно"

[[case]]
name = "лишние пробелы"
raw = "надо    сделать   вот   так"
expected = "Надо сделать вот так"
